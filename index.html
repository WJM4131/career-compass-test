S:[['AI应用实施专员','搭建现成AI工具工作流、知识库和自动化','AI应用实施 / AI自动化实施','低至中','先掌握一个自动化工具，并制作2个真实业务演示'],['业务流程优化专员','梳理业务流程、减少重复操作','流程优化专员 / 业务流程专员','中','练习流程图、SOP和效果前后对比'],['产品运营专员','把用户问题转成产品优化需求','产品运营 / 用户运营','中','制作一份产品问题诊断与改进方案'],['项目助理','跟进项目节点、文档与跨部门协作','项目助理 / 项目执行','低至中','练习需求文档、进度表和风险清单']],

let state={step:-2,answers:[],edu:'',exp:'',goal:'',verified:sessionStorage.getItem(STORAGE_KEY)==='yes',result:null};
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function btn(t,fn,primary=false){return `<button class="btn ${primary?'primary':''}" onclick="${fn}">${t}</button>`}
function shell(x){app.innerHTML=x;window.scrollTo({top:0,behavior:'instant'})}
function render(){if(!state.verified)return gate();if(state.step===-2)return intro();if(state.step<18)return question();if(state.step<21)return background();return report()}
function gate(){shell(`<div class="eyebrow">CAREER COMPASS · ACCESS</div><div class="card"><h1>输入兑换码，开启职业探索</h1><p>请输入购买后收到的通用兑换码，可在不同设备使用。</p><input class="field" id="code" placeholder="请输入兑换码" autocomplete="off">${btn('验证并开始 →','verifyCode()',true)}<p id="msg" class="muted" aria-live="polite"></p></div><p class="muted">本产品是职业探索辅助工具，不是心理诊断，也不保证录用或收入。</p>`)}
function verifyCode(){const code=document.getElementById('code').value.trim();const msg=document.getElementById('msg');if(!code){msg.textContent='请先输入兑换码';return}if(code.toUpperCase()===SHARED_CODE){state.verified=true;sessionStorage.setItem(STORAGE_KEY,'yes');render()}else{msg.textContent='兑换码不正确，请核对购买后收到的兑换码'}}
function intro(){shell(`<div class="eyebrow">YOUR CAREER COMPASS · V2</div><h1>你的职业优势，<br>适合走哪条赚钱路径？</h1><p>不只告诉你“你是什么类型”，还把结果转成可搜索的真实岗位、技能补齐方案和30天行动路线。</p><div class="card"><span class="pill">18道职业情境题</span><span class="pill">3道背景题</span><span class="pill">真实岗位匹配</span><span class="pill">30天计划</span><h2>大约需要 5–7 分钟</h2><p>按你真实的工作习惯选择，不必选“看起来更优秀”的答案。</p>${btn('开始探索 →','state.step=0;render()',true)}</div><p class="muted">结果基于自陈式情境偏好，用于启发职业探索，不是经过心理测量学验证的职业能力评估。</p>`)}
function question(){const n=state.step,q=QUESTIONS[n];shell(`<div class="eyebrow">PART 01 · 职业情境</div><div class="row"><span class="muted">第 ${n+1} / 18 题</span><span class="muted">${Math.round(n/21*100)}%</span></div><div class="progress"><div class="bar" style="width:${n/21*100}%"></div></div><div class="card"><h2>${q[0]}</h2>${q[1].map(([label,type],i)=>btn(esc(label),`pick(${i})`)).join('')}</div>${n>0?btn('← 上一题','state.step--;render()'):''}`)}
function pick(i){state.answers[state.step]=QUESTIONS[state.step][1][i][1];state.step++;render()}
const BG=[{title:'你的最高学历是？',key:'edu',opts:['高中 / 中专及以下','大专','本科','研究生及以上','不方便透露']},{title:'你的相关工作经验更接近？',key:'exp',opts:['暂无正式工作经验','1年以内','1–3年','3年以上','有经验，但计划跨行业']},{title:'你接下来最想实现什么？',key:'goal',opts:['尽快找到一份工作','3–6个月内转行','保留主业，先尝试副业','寻找长期成长方向']}];
function background(){const j=state.step-18,b=BG[j];shell(`<div class="eyebrow">PART 02 · 现实职业背景</div><div class="row"><span class="muted">第 ${state.step+1} / 21 题</span><span class="muted">${Math.round(state.step/21*100)}%</span></div><div class="progress"><div class="bar" style="width:${state.step/21*100}%"></div></div><div class="card"><h2>${b.title}</h2>${b.opts.map((x,i)=>btn(esc(x),`setBg(${i})`)).join('')}</div>${btn('← 上一题','state.step--;render()')}`)}
function setBg(i){const b=BG[state.step-18];state[b.key]=b.opts[i];state.step++;render()}
function compute(){let scores=Object.fromEntries(Object.keys(TYPES).map(x=>[x,0]));state.answers.forEach(t=>{if(t)scores[t]++});let ranks=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]||Object.keys(TYPES).indexOf(a)-Object.keys(TYPES).indexOf(b));return{scores,ranks,first:ranks[0],second:ranks[1]}}
function fit(job,idx){const goal=state.goal;const exp=state.exp;let caution='';if(job[3].includes('高'))caution='通常需要较强的相关经验或案例，不建议仅凭测试结果直接转岗。';else if(job[3]==='中')caution='建议先核对招聘JD的学历、经验和技能要求。';else caution='可从助理或初级岗位开始核对招聘条件。';if(exp==='暂无正式工作经验'||exp==='1年以内')caution+=' 优先搜索“助理 / 初级 / 专员”版本。';if(goal==='保留主业，先尝试副业')caution+=' 当前目标偏副业，可先用小项目验证能力，不必急于跳槽。';return caution}
function report(){const r=compute();state.result=r;const a=TYPES[r.first],b=TYPES[r.second];const candidates=[...JOBS[r.first].slice(0,3),...JOBS[r.second].slice(0,2)];const seen=new Set();const jobs=candidates.filter(j=>{if(seen.has(j[0]))return false;seen.add(j[0]);return true}).slice(0,5);const skill=jobs[0][4];shell(`<div class="eyebrow">YOUR CAREER COMPASS · REPORT</div><h1>你的职业优势与赚钱路径</h1><div class="card"><span class="muted">首要优势倾向</span><h1 style="color:var(--accent);margin:8px 0">${a.name}</h1><h3>${a.tag}</h3><p>${a.strength}</p><div class="divider"></div><span class="muted">第二优势倾向</span><h2>${b.name}</h2><p>${b.tag}</p><span class="pill">${esc(state.edu)}</span><span class="pill">${esc(state.exp)}</span><span class="pill">${esc(state.goal)}</span></div><div class="card"><h2>01 · 你的工作优势与消耗点</h2><p><b>你更容易发挥优势的场景：</b>${a.strength}，同时结合${b.strength}。</p><p><b>需要警惕的工作消耗：</b>${a.risk}；${b.risk}。</p><div class="notice">这是基于选择偏好的初步推断，不代表你只能从事这些职业，也不能替代工作能力与招聘条件评估。</div></div><div class="card"><h2>02 · 可以实际搜索的职业岗位</h2><p class="muted">以下是岗位方向库中的示例名称，不是实时招聘职位，也不代表这些岗位目前有空缺。</p>${jobs.map((j,i)=>`<div class="job"><div class="rank">推荐探索 ${String(i+1).padStart(2,'0')}</div><h3>${j[0]}</h3><p>${j[1]}</p><span class="pill">入行门槛：${j[3]}</span><p><b>招聘搜索词：</b>${j[2]}</p><p><b>作品 / 技能准备：</b>${j[4]}</p><p class="muted">${fit(j,i)}</p><button class="btn small no-print" onclick="copyText('${j[2]}',this)">复制搜索关键词</button></div>`).join('')}</div><div class="card"><h2>03 · 适合探索的轻量副业</h2><p>${SIDE[r.first]}；也可以结合第二优势尝试${SIDE[r.second]}。</p><p class="muted">建议先做一个可展示的样品，再判断是否存在真实付费需求。副业收入没有保证。</p></div><div class="card"><h2>04 · 你的30天行动计划</h2><div class="job"><div class="rank">第1周 · 验证方向</div><h3>选择两个岗位，拆解招聘要求</h3><p>在招聘平台各查看5条JD，记录重复出现的技能、学历、经验要求；挑出你目前最接近的一类。</p></div><div class="job"><div class="rank">第2周 · 补齐关键能力</div><h3>集中练习一项高频技能</h3><p>${skill}。每天安排20–40分钟，记录能展示的过程。</p></div><div class="job"><div class="rank">第3周 · 做出作品证据</div><h3>完成一个可展示的小项目</h3><p>整理成一页案例：原始问题、你的解决方法、使用工具、成果截图，以及可验证的结果。</p></div><div class="job"><div class="rank">第4周 · 获取市场反馈</div><h3>投递、沟通或试卖</h3><p>${state.goal==='保留主业，先尝试副业'?'把样品展示给5位潜在用户，询问真实需求与付费意愿；根据反馈修改一次。':'选择匹配度较高的岗位，优化简历与作品，进行5次有针对性的投递或职业交流。'}</p></div></div><div class="card"><h2>05 · 你的优势分布</h2>${r.ranks.map(k=>`<div style="margin:12px 0"><div class="row"><span>${TYPES[k].name}</span><b>${r.scores[k]}分</b></div><div class="progress" style="margin:7px 0"><div class="bar" style="width:${r.scores[k]/18*100}%"></div></div></div>`).join('')}<p class="muted">分数仅代表本次18题中被选择的次数，不是标准化能力分数。</p></div><div class="notice">免责声明：这是原创的职业兴趣与工作偏好探索产品，不是霍兰德、MBTI等标准化量表；推荐岗位需结合实际招聘条件、地域、经验与能力验证。</div><div class="no-print" style="margin-top:24px">${btn('打印 / 保存成PDF','window.print()',true)}${btn('复制报告摘要','copySummary()')}${btn('重新测试','restart()')}</div>`)}
function copyText(t,el){navigator.clipboard.writeText(t).then(()=>{el.textContent='已复制'}).catch(()=>{el.textContent='复制失败，请手动选中'})}
function copySummary(){const r=state.result;const t=`职业优势与赚钱路径测试\n首要优势：${TYPES[r.first].name}\n第二优势：${TYPES[r.second].name}\n岗位方向：${[...JOBS[r.first].slice(0,3),...JOBS[r.second].slice(0,2)].map(j=>j[0]).join('、')}\n注意：结果仅用于职业探索，不代表职业资格或招聘承诺。`;navigator.clipboard.writeText(t).then(()=>alert('摘要已复制')).catch(()=>alert('复制失败'))}
function restart(){if(confirm('重新测试将清除本页答案，确定继续吗？')){state.step=-2;state.answers=[];state.edu='';state.exp='';state.goal='';render()}}
render();
</script></body></html>
